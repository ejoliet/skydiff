[project]
name = "skydiff"
version = "0.1.0"
description = "git log for the universe — nightly sky diff (spike-1)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "duckdb>=1.0",
    "rich>=13.7",
]

[project.scripts]
skydiff = "skydiff.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skydiff"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "ANN"]
ignore = ["ANN401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
